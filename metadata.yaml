name: astrbot_plugin_warband_status
display_name: 骑砍战团服务器查询
short_desc: 查询骑马与砍杀：战团联机服务器（中文站 CN_X 系列）的在线人数、游戏模式、地图、模块。
desc: |
  查询骑马与砍杀：战团联机服务器实时状态。内置骑砍中文站 CN_X 系列服务器
  （CN_X1 / CN_X3_GK / CN_X4 等，经官方主服务器列表自动发现），并支持固定端点
  直查（默认 106.54.62.240:7240 / 106.54.62.240:7242），逐台显示服务器名称、
  游戏模式、当前地图、当前模块与在线人数（当前/上限）。

  调用方式：
  - 指令：@机器人或以唤醒前缀发送「查服 [目标]」，如「查服 X1」「查服 CN_X3_GK」「查服 全部」
  - 关键字：直接发送「查服」「查询服务器」「服务器状态」「骑砍服务器」等（可跟目标，如「查服 X3」）

  数据来源为 TaleWorlds 官方主服务器列表 + 服务器直连探测；插件在后台定时刷新并
  内存缓存结果，收到查询优先读缓存，回复速度快。支持群聊/私聊独立开关与群号/
  用户白名单配置，未开启或不匹配时静默忽略（指令路径会给出提示）。
author: Echo
version: 1.0.0
repo: https://github.com/fanqiecd/astrbot_plugin_warband_status
astrbot_version: ">=4.17.0,<5"
support_platforms:
  - aiocqhttp
tags:
  - 游戏
  - utility
